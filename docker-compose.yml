services:
  # Gateway mode. ConnectWise credentials arrive per request on X-CWA-* headers.
  # Do not set CW_AUTOMATE_SERVER_URL, CW_AUTOMATE_CLIENT_ID, CW_AUTOMATE_USERNAME,
  # CW_AUTOMATE_PASSWORD, or env_file here — that would put static vendor
  # credentials in the container. Compose still interpolates CONDUIT_S2S_SECRET
  # from the project .env. For AUTH_MODE=env, pass CW_AUTOMATE_* on that
  # process instead (see the README).
  connectwise-automate-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: ghcr.io/wyre-ai/connectwise-automate-mcp:latest
    container_name: connectwise-automate-mcp-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - MCP_TRANSPORT=http
      - MCP_HTTP_PORT=8080
      - MCP_HTTP_HOST=0.0.0.0
      - AUTH_MODE=gateway
      - "CONDUIT_S2S_SECRET=${CONDUIT_S2S_SECRET:?set CONDUIT_S2S_SECRET}"
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes: {}
